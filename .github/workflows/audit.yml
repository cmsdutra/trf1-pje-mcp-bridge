name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # segunda 06:17 UTC — pega CVEs novos sem depender de commits
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  quality:
    name: Qualidade (tsc, lint, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run lint
      - run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: test-reports, path: reports/, if-no-files-found: ignore }

  policy:
    name: Políticas do projeto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/audit/policy-checks.sh

  dependencies:
    name: Dependências (npm audit, licenças, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: npm audit (produção) — bloqueia em high/critical
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev) — informativo
        run: npm audit --audit-level=high || echo "::warning::vulnerabilidades em devDependencies"
      - run: bash scripts/audit/licenses.sh
      - run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with: { name: sbom, path: sbom.cdx.json }

  dependency-review:
    name: Revisão de dependências do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks no histórico completo
        run: |
          v=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks detect --no-banner --redact --verbose

  summary:
    name: Resultado da auditoria
    if: always()
    needs: [quality, policy, dependencies, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar
        run: |
          {
            echo "## Resultado da auditoria"
            echo "| Job | Resultado |"; echo "|---|---|"
            echo "| quality | ${{ needs.quality.result }} |"
            echo "| policy | ${{ needs.policy.result }} |"
            echo "| dependencies | ${{ needs.dependencies.result }} |"
            echo "| secrets | ${{ needs.secrets.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ]
